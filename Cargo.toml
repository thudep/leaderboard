[package]
authors = ["adamanteye <adamanteye@disroot.org>"]
description = "Ghost hunter leaderboard"
edition = "2024"
license = "MIT"
name = "leaderboard"
publish = false
version = "0.1.6"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { features = ["derive"], version = "4.6.7" }
serde = { features = ["derive"], version = "1.0.229" }
serde_json = "1.0.154"
compio = { version = "0.19.2", features = [
    "fs",
    "io",
    "io-uring",
    "runtime",
    "macros",
    "net",
    "signal",
] }
chrono = { features = ["serde"], version = "0.4.45" }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
cyper-axum = "0.9.0"
futures-util = "0.3.34"

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
